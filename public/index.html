<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Agent Pet - OpenClaw</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            color: #4ecdc4;
        }
        .header p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        .pet-screen {
            background: #0f0f23;
            border-radius: 20px;
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .pet {
            font-size: 100px;
            animation: bounce 2s infinite;
            margin: 20px 0;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .stats {
            width: 100%;
            margin-top: 20px;
        }
        .stat {
            display: flex;
            align-items: center;
            margin: 12px 0;
        }
        .stat-icon { width: 30px; font-size: 20px; }
        .stat-bar {
            flex: 1;
            height: 25px;
            background: #333;
            border-radius: 12px;
            overflow: hidden;
            margin: 0 10px;
        }
        .stat-fill {
            height: 100%;
            border-radius: 12px;
            transition: width 0.5s ease;
        }
        .hunger { background: linear-gradient(90deg, #ff6b6b, #ff8e8e); }
        .happy { background: linear-gradient(90deg, #4ecdc4, #44a08d); }
        .energy { background: linear-gradient(90deg, #45b7d1, #96c93d); }
        .stat-value {
            width: 40px;
            text-align: right;
            font-weight: bold;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .btn {
            background: #16213e;
            border: 2px solid #4ecdc4;
            border-radius: 15px;
            padding: 15px 10px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn:active {
            transform: scale(0.95);
            background: #4ecdc4;
        }
        .btn-label {
            font-size: 12px;
            margin-top: 5px;
            color: #888;
        }
        .btn:active .btn-label {
            color: #1a1a2e;
        }
        .level-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐣 Agent Pet</h1>
            <p>Your OpenClaw companion</p>
        </div>
        
        <div class="pet-screen">
            <div class="level-badge" id="level">Level 1 - Egg</div>
            
            <div class="pet" id="pet">🥚</div>
            
            <div class="stats">
                <div class="stat">
                    <span class="stat-icon">🍕</span>
                    <div class="stat-bar">
                        <div class="stat-fill hunger" id="hunger-bar" style="width: 50%"></div>
                    </div>
                    <span class="stat-value" id="hunger-val">50</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">😊</span>
                    <div class="stat-bar">
                        <div class="stat-fill happy" id="happy-bar" style="width: 50%"></div>
                    </div>
                    <span class="stat-value" id="happy-val">50</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⚡</span>
                    <div class="stat-bar">
                        <div class="stat-fill energy" id="energy-bar" style="width: 100%"></div>
                    </div>
                    <span class="stat-value" id="energy-val">100</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="feed()">
                🍕
                <span class="btn-label">FEED</span>
            </button>
            <button class="btn" onclick="play()">
                🎮
                <span class="btn-label">PLAY</span>
            </button>
            <button class="btn" onclick="code()">
                💻
                <span class="btn-label">CODE</span>
            </button>
        </div>
        
        <div class="footer">
            Built with 💜 by TURAC
        </div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Pet state
        let pet = {
            stage: 0,
            hunger: 50,
            happy: 50,
            energy: 100,
            xp: 0,
            level: 1
        };
        
        const stages = ['🥚', '🤖', '💻', '🦖', '👑'];
        const stageNames = ['Egg', 'Baby Bot', 'Teen Coder', 'Senior Dev', '10x Legend'];
        
        function updateUI() {
            document.getElementById('pet').textContent = stages[pet.stage];
            document.getElementById('level').textContent = `Level ${pet.level} - ${stageNames[pet.stage]}`;
            
            document.getElementById('hunger-bar').style.width = pet.hunger + '%';
            document.getElementById('hunger-val').textContent = pet.hunger;
            
            document.getElementById('happy-bar').style.width = pet.happy + '%';
            document.getElementById('happy-val').textContent = pet.happy;
            
            document.getElementById('energy-bar').style.width = pet.energy + '%';
            document.getElementById('energy-val').textContent = pet.energy;
        }
        
        function feed() {
            pet.hunger = Math.min(100, pet.hunger + 20);
            pet.energy = Math.max(0, pet.energy - 5);
            addXP(5);
            updateUI();
            tg.HapticFeedback.impactOccurred('light');
        }
        
        function play() {
            pet.happy = Math.min(100, pet.happy + 15);
            pet.energy = Math.max(0, pet.energy - 10);
            pet.hunger = Math.max(0, pet.hunger - 10);
            addXP(10);
            updateUI();
            tg.HapticFeedback.impactOccurred('medium');
        }
        
        function code() {
            pet.xp += 10;
            pet.energy = Math.max(0, pet.energy - 5);
            pet.hunger = Math.max(0, pet.hunger - 5);
            addXP(15);
            updateUI();
            tg.HapticFeedback.notificationOccurred('success');
        }
        
        function addXP(amount) {
            pet.xp += amount;
            if (pet.xp >= 100) {
                pet.level++;
                pet.xp = 0;
                checkEvolution();
            }
        }
        
        function checkEvolution() {
            const oldStage = pet.stage;
            if (pet.level >= 20) pet.stage = 4;
            else if (pet.level >= 15) pet.stage = 3;
            else if (pet.level >= 10) pet.stage = 2;
            else if (pet.level >= 5) pet.stage = 1;
            
            if (pet.stage > oldStage) {
                tg.showPopup({
                    title: '✨ Evolution!',
                    message: `Your pet evolved into ${stageNames[pet.stage]}!`
                });
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
        
        // Auto decay
        setInterval(() => {
            pet.hunger = Math.max(0, pet.hunger - 1);
            pet.happy = Math.max(0, pet.happy - 1);
            updateUI();
        }, 60000);
        
        updateUI();
    </script>
</body>
</html>
