<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Agent Pet - OpenClaw</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #4ecdc4;
        }
        
        .header p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .pet-screen {
            background: #0f0f23;
            border-radius: 20px;
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        /* Pixel Art Pet */
        .pet-container {
            width: 150px;
            height: 150px;
            display: flex;
          align-items: center;
            justify-content: center;
            margin: 10px 0;
            position: relative;
        }
        
        .pet-sprite {
            width: 120px;
            height: 120px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: all 0.3s ease;
        }
        
        /* SVG Pixel Art Styles */
        .pet-pixel {
            width: 100%;
            height: 100%;
        }
        
        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        
        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px gold); }
            50% { filter: drop-shadow(0 0 30px gold); }
        }
        
        .animate-bounce {
            animation: bounce 2s infinite;
        }
        
        .animate-glow {
            animation: glow 2s infinite;
        }
        
        .stats {
            width: 100%;
            margin-top: 15px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .stat-icon { 
            width: 30px; 
            font-size: 20px;
            text-align: center;
        }
        
        .stat-bar {
            flex: 1;
            height: 22px;
            background: #333;
            border-radius: 11px;
            overflow: hidden;
            margin: 0 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .stat-fill {
            height: 100%;
            border-radius: 11px;
            transition: width 0.5s ease;
        }
        
        .hunger { background: linear-gradient(90deg, #ff6b6b, #ff8e8e); }
        .happy { background: linear-gradient(90deg, #4ecdc4, #44a08d); }
        .energy { background: linear-gradient(90deg, #45b7d1, #96c93d); }
        
        .stat-value {
            width: 35px;
            text-align: right;
            font-weight: bold;
            font-size: 14px;
        }
        
        .level-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        
        .btn {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border: 2px solid #4ecdc4;
            border-radius: 15px;
            padding: 15px 10px;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: scale(0.95);
            background: #4ecdc4;
            box-shadow: 0 2px 10px rgba(78, 205, 196, 0.5);
        }
        
        .btn-label {
            font-size: 11px;
            margin-top: 5px;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .btn:active .btn-label {
            color: #1a1a2e;
        }
        
        .footer {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 11px;
        }
        
        /* Particle effects */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐣 Agent Pet</h1>
            <p>Your OpenClaw companion</p>
        </div>
        
        <div class="pet-screen">
            <div class="level-badge" id="level">Level 1 - Egg</div>
            
            <div class="pet-container">
                <!-- Pixel Art SVG -->
                <svg id="pet-svg" class="pet-sprite animate-bounce" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                    <!-- Egg Stage Pixel Art -->
                    <rect x="10" y="8" width="12" height="16" fill="#FFE4B5"/>
                    <rect x="8" y="10" width="2" height="12" fill="#FFD700"/>
                    <rect x="22" y="10" width="2" height="12" fill="#FFD700"/>
                    <rect x="10" y="6" width="12" height="2" fill="#FFD700"/>
                    <rect x="10" y="24" width="12" height="2" fill="#FFD700"/>
                    <!-- Shine -->
                    <rect x="12" y="10" width="2" height="2" fill="#FFF8DC"/>
                </svg>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <span class="stat-icon">🍕</span>
                    <div class="stat-bar">
                        <div class="stat-fill hunger" id="hunger-bar" style="width: 50%"></div>
                    </div>
                    <span class="stat-value" id="hunger-val">50</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">😊</span>
                    <div class="stat-bar">
                        <div class="stat-fill happy" id="happy-bar" style="width: 50%"></div>
                    </div>
                    <span class="stat-value" id="happy-val">50</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⚡</span>
                    <div class="stat-bar">
                        <div class="stat-fill energy" id="energy-bar" style="width: 100%"></div>
                    </div>
                    <span class="stat-value" id="energy-val">100</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="feed()">
                🍕
                <span class="btn-label">Feed</span>
            </button>
            <button class="btn" onclick="play()">
                🎮
                <span class="btn-label">Play</span>
            </button>
            <button class="btn" onclick="code()">
                💻
                <span class="btn-label">Code</span>
            </button>
        </div>
        
        <div class="footer">
            Built with 💜 by TURAC
        </div>
    </div>

    <script>
        // Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Pixel Art SVGs for each stage
        const petSVGs = {
            0: `<rect x="10" y="8" width="12" height="16" fill="#FFE4B5"/><rect x="8" y="10" width="2" height="12" fill="#FFD700"/><rect x="22" y="10" width="2" height="12" fill="#FFD700"/><rect x="10" y="6" width="12" height="2" fill="#FFD700"/><rect x="10" y="24" width="12" height="2" fill="#FFD700"/><rect x="12" y="10" width="2" height="2" fill="#FFF8DC"/>`,
            
            1: `<rect x="8" y="6" width="16" height="20" fill="#4ECDC4"/><rect x="6" y="8" width="2" height="16" fill="#44A08D"/><rect x="26" y="8" width="2" height="16" fill="#44A08D"/><rect x="8" y="4" width="16" height="2" fill="#44A08D"/><rect x="8" y="26" width="16" height="2" fill="#44A08D"/><rect x="12" y="10" width="3" height="3" fill="#FFF"/><rect x="17" y="10" width="3" height="3" fill="#FFF"/><rect x="13" y="11" width="1" height="1" fill="#000"/><rect x="18" y="11" width="1" height="1" fill="#000"/><rect x="13" y="16" width="6" height="2" fill="#FF6B6B"/>`,
            
            2: `<rect x="6" y="4" width="20" height="24" fill="#667EEA"/><rect x="4" y="6" width="2" height="20" fill="#764BA2"/><rect x="28" y="6" width="2" height="20" fill="#764BA2"/><rect x="6" y="2" width="20" height="2" fill="#764BA2"/><rect x="6" y="28" width="20" height="2" fill="#764BA2"/><rect x="10" y="8" width="4" height="4" fill="#FFF"/><rect x="18" y="8" width="4" height="4" fill="#FFF"/><rect x="11" y="9" width="2" height="2" fill="#000"/><rect x="19" y="9" width="2" height="2" fill="#000"/><rect x="10" y="16" width="12" height="4" fill="#FFD93D"/><rect x="8" y="20" width="4" height="4" fill="#4ECDC4"/><rect x="20" y="20" width="4" height="4" fill="#4ECDC4"/>`,
            
            3: `<rect x="4" y="2" width="24" height="28" fill="#45B7D1"/><rect x="2" y="4" width="2" height="24" fill="#96C93D"/><rect x="30" y="4" width="2" height="24" fill="#96C93D"/><rect x="4" y="0" width="24" height="2" fill="#96C93D"/><rect x="4" y="30" width="24" height="2" fill="#96C93D"/><rect x="8" y="6" width="5" height="5" fill="#FFF"/><rect x="19" y="6" width="5" height="5" fill="#FFF"/><rect x="9" y="7" width="3" height="3" fill="#000"/><rect x="20" y="7" width="3" height="3" fill="#000"/><rect x="8" y="14" width="16" height="4" fill="#FF6B6B"/><rect x="6" y="22" width="5" height="5" fill="#FFD93D"/><rect x="21" y="22" width="5" height="5" fill="#FFD93D"/><rect x="12" y="24" width="8" height="4" fill="#96C93D"/>`,
            
            4: `<rect x="2" y="0" width="28" height="32" fill="#FFD700"/><rect x="0" y="2" width="2" height="28" fill="#FFA500"/><rect x="32" y="2" width="2" height="28" fill="#FFA500"/><rect x="2" y="-2" width="28" height="2" fill="#FFA500"/><rect x="2" y="32" width="28" height="2" fill="#FFA500"/><rect x="6" y="4" width="6" height="6" fill="#FFF"/><rect x="20" y="4" width="6" height="6" fill="#FFF"/><rect x="7" y="5" width="4" height="4" fill="#000"/><rect x="21" y="5" width="4" height="4" fill="#000"/><rect x="8" y="6" width="2" height="2" fill="#FFF"/><rect x="22" y="6" width="2" height="2" fill="#FFF"/><rect x="6" y="14" width="20" height="4" fill="#FF6B6B"/><rect x="4" y="20" width="6" height="6" fill="#4ECDC4"/><rect x="22" y="20" width="6" height="6" fill="#4ECDC4"/><rect x="12" y="22" width="8" height="6" fill="#96C93D"/><rect x="10" y="2" width="4" height="2" fill="#FFD700"/><rect x="18" y="2" width="4" height="2" fill="#FFD700"/>`
        };
        
        let pet = {
            stage: 0,
            hunger: 50,
            happy: 50,
            energy: 100,
            xp: 0,
            level: 1
        };
        
        const stageNames = ['Egg', 'Baby Bot', 'Teen Coder', 'Senior Dev', '10x Legend'];
        
        function updatePetSVG() {
            const svg = document.getElementById('pet-svg');
            svg.innerHTML = petSVGs[pet.stage];
            
            // Update animation class
            svg.className = 'pet-sprite animate-bounce';
            if (pet.stage === 4) {
                svg.classList.add('animate-glow');
            }
        }
        
        function updateUI() {
            updatePetSVG();
            document.getElementById('level').textContent = `Level ${pet.level} - ${stageNames[pet.stage]}`;
            
            document.getElementById('hunger-bar').style.width = pet.hunger + '%';
            document.getElementById('hunger-val').textContent = pet.hunger;
            
            document.getElementById('happy-bar').style.width = pet.happy + '%';
            document.getElementById('happy-val').textContent = pet.happy;
            
            document.getElementById('energy-bar').style.width = pet.energy + '%';
            document.getElementById('energy-val').textContent = pet.energy;
        }
        
        function feed() {
            pet.hunger = Math.min(100, pet.hunger + 20);
            pet.energy = Math.max(0, pet.energy - 5);
            addXP(5);
            updateUI();
            tg.HapticFeedback.impactOccurred('light');
        }
        
        function play() {
            pet.happy = Math.min(100, pet.happy + 15);
            pet.energy = Math.max(0, pet.energy - 10);
            pet.hunger = Math.max(0, pet.hunger - 10);
            addXP(10);
            updateUI();
            tg.HapticFeedback.impactOccurred('medium');
        }
        
        function code() {
            pet.xp += 10;
            pet.energy = Math.max(0, pet.energy - 5);
            pet.hunger = Math.max(0, pet.hunger - 5);
            addXP(15);
            updateUI();
            tg.HapticFeedback.notificationOccurred('success');
        }
        
        function addXP(amount) {
            pet.xp += amount;
            if (pet.xp >= 100) {
                pet.level++;
                pet.xp = 0;
                checkEvolution();
            }
        }
        
        function checkEvolution() {
            const oldStage = pet.stage;
            if (pet.level >= 20) pet.stage = 4;
            else if (pet.level >= 15) pet.stage = 3;
            else if (pet.level >= 10) pet.stage = 2;
            else if (pet.level >= 5) pet.stage = 1;
            
            if (pet.stage > oldStage) {
                tg.showPopup({
                    title: '✨ Evolution!',
                    message: `Your pet evolved into ${stageNames[pet.stage]}!`
                });
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
        
        // Auto decay
        setInterval(() => {
            pet.hunger = Math.max(0, pet.hunger - 1);
            pet.happy = Math.max(0, pet.happy - 1);
            updateUI();
        }, 60000);
        
        updateUI();
    </script>
</body>
</html>
